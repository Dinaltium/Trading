<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1010" viewBox="0 0 760 1010" role="img">
<title>Autonomous options-trading agent with four TradeTrap integrity guards and live-vs-shadow LLM benchmarking</title>
<desc>A scheduler pulls Alpaca market data every 15 minutes into two signal engines (IV Rank/VRP and a LightGBM direction classifier), which combine into a quant signal vector. Guard 1 validates that vector before any model sees it. Four LLMs then reason in parallel: Groq is live, while Claude Code CLI, Featherless and Mistral run as shadows. Guard 2 checks the live model's reasoning quotes real signal values, and Guard 3 cross-validates the four models' picks. A deterministic rulebook then rejects any strategy the rules do not mandate, the risk gate sizes the position with Kelly, and Guard 4 reconciles the agent's position map against a second read of broker state before the Alpaca CLI submits an atomic multi-leg order. Every step writes to one audit log.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

