<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1350" viewBox="0 0 980 1350" role="img">
<title>Options Alpha Agent — one trading cycle end to end</title>
<desc>Each scheduler tick first runs an exit pass in every non-paused mode: open spreads are read from the broker, valued against their worst case from cost basis or strike width, checked against a deterministic stop-loss, and closed as a multi-leg order with explicit close intents. Only when the mode is running does the entry pipeline follow. Two signal engines feed a quant signal vector; if either is unavailable the cycle aborts and is logged. Guard 1 validates the vector before any model sees it, blocking on ranges and NaN and warning on consistency. An AZTE z-score is recorded but does not gate. One configured model is live and the other two shadow it on identical inputs. Guard 2 checks every signal figure the live model quotes against the payload it was given, and Guard 3 scores agreement across all three. A model that chooses cash ends the cycle there; a model that returns nothing usable does not, because the agent then executes the strategy its own deterministic rulebook mandates, with no model in the loop, so a provider outage cannot become a trading halt. Otherwise a spread is built from the live chain, the risk gate refuses underlyings under adaptive restriction after three consecutive losing closes, then applies the rulebook and every limit, a disk-persisted circuit breaker can block, and Guard 4 reconciles the agent's position map against a second independent broker read in both dry-run and live modes. Only submission itself is live-only. Every rejection, abstention and fill is written to one audit log.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
