name: Trading cycle

# Runs the trading loop on GitHub's own servers, not anyone's laptop. This is what makes
# the system "always on" — judges can watch it execute live in the Actions tab below,
# with full printed output, whether or not anyone's computer is open.
#
# The cadence is driven from INSIDE the job, not by the cron. The previous version asked
# for a firing every 15 minutes (`*/15 13-20 * * 1-5`); across Aug 29 and Aug 31 that
# schedule was due ~36 times and fired zero times. GitHub explicitly deprioritises
# short-interval schedules under load, so betting the whole trading day on 26 separate
# cron events landing is a bet that already failed once.
#
# Instead: two firings a day, each starting a process that drives its own 15-minute loop
# (`src.scheduler --session`). One landing cron now covers a half-session. Each job stays
# under the 6h GitHub-hosted job ceiling and exits green at the closing bell.
#
#   13:25 UTC  ->  330 min budget  ->  covers 09:30-14:55 ET (open through mid-afternoon)
#   18:55 UTC  ->   90 min budget  ->  covers 14:55-16:00 ET, self-exits at the close
#
# Both are weekdays-only; the script also checks Alpaca's own market clock and skips
# cleanly outside real trading hours, so holidays and early closes need no bookkeeping.
on:
  schedule:
    - cron: "25 13 * * 1-5"
    - cron: "55 18 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "once = a single cycle (safe smoke test) | session = run the loop"
        type: choice
        options: [once, session]
        default: once
      max_minutes:
        description: "session mode only: minutes before the job ends itself"
        default: "60"

# Two overlapping sessions would double-submit cycles and race each other's audit-log
# pushes. Queue instead of running concurrently; never cancel a run that is mid-cycle.
concurrency:
  group: trading-session
  cancel-in-progress: false

permissions:
  contents: write  # needed so the run can commit+push logs/audit_log.jsonl and config/live_settings.json reads

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    # Must exceed the largest --max-minutes budget (330) plus setup, or the runner kills the
    # session mid-day and the job shows red. 350 still sits under GitHub's 6h hard ceiling.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The execution path shells out to Alpaca's own CLI (see src/alpaca_cli.py), which is
      # not a pip package and is absent from the runner image. Without these two steps a
      # --live run reaches the risk gate, gets an approval, and then dies at submission with
      # "'alpaca' CLI not found on PATH" — the agent would look healthy and trade nothing.
      - name: Install the Alpaca CLI
        run: |
          go install github.com/alpacahq/cli/cmd/alpaca@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Configure the Alpaca CLI paper profile
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          alpaca profile login --api-key --paper --name paper --key "$ALPACA_API_KEY" --secret "$ALPACA_SECRET_KEY"

      # Printed into the run log on purpose: it is public, judge-readable evidence that the
      # resolved trading endpoint is paper-api before any order is built. The step fails the
      # job if any check fails, so a broken run never reaches the trading step.
      - name: Verify the CLI resolves to the paper endpoint
        run: alpaca doctor

      - name: Configure git identity for the audit-log push
        run: |
          git config user.name "trading-cycle-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run the trading loop
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FEATHER_API_KEY: ${{ secrets.FEATHER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        # No --live flag: this runs dry_run=True (real signals, real AI decisions, real
        # risk-gate evaluation, real IV-history recording - nothing skipped) but does not
        # submit real paper orders. Add --live once the fresh competition account is ready
        # and you deliberately want this workflow to place real trades.
        #
        # The 13:25 cron gets the long budget, the 18:55 cron the short tail, and a manual
        # dispatch defaults to a single cycle so smoke-testing never starts a 5-hour job.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "25 13 * * 1-5" ]; then
              BUDGET=330
            else
              BUDGET=90
            fi
            python -m src.scheduler --session --max-minutes "$BUDGET"
          elif [ "${{ inputs.mode }}" = "session" ]; then
            python -m src.scheduler --session --max-minutes "${{ inputs.max_minutes }}"
          else
            python -m src.scheduler --once
          fi
