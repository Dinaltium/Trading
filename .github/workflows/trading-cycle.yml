name: Trading cycle

# Runs the trading loop on GitHub's own servers, not anyone's laptop. This is what makes
# the system "always on" — judges can watch it execute live in the Actions tab below,
# with full printed output, whether or not anyone's computer is open.
#
# The cadence is driven from INSIDE the job, not by the trigger. An earlier version asked for
# a firing every 15 minutes; across Aug 29 and Aug 31 that schedule was due ~36 times and fired
# zero. Each run now starts a process that drives its own 15-minute loop
# (`src.scheduler --session`), so one trigger covers a half-session. Jobs stay under the 6h
# GitHub-hosted ceiling and exit green at the closing bell.
#
#   13:28 UTC  ->  330 min budget  ->  open through mid-afternoon
#   19:00 UTC  ->   65 min budget  ->  the closing hour, self-exits at the bell
#
# The script also checks Alpaca's own market clock every tick, so holidays and early closes
# need no bookkeeping here.
# GitHub's own scheduler is no longer used. It was due four times across Aug 29 - Sep 1 and
# fired once, four hours late, after the close - a session that spent its whole budget printing
# "market closed" and reported success, which is worse than not firing because it looks healthy.
# Every session that actually traded was started by hand or by an external scheduler.
#
# The trigger now lives outside GitHub: two cron-job.org jobs POST to this workflow's
# workflow_dispatch endpoint at 13:28 UTC (330 min) and 19:00 UTC (65 min), weekdays. Removing
# the schedule: block here stops late deliveries queueing behind live sessions and filling the
# run history with cancellations.
# Two independent triggers, on purpose. GitHub's scheduler is unreliable — it was due four
# times across Aug 29-Sep 1 and fired once, four hours late — so cron-job.org is the primary
# and this is the backup. Either one alone starts a full session; the concurrency group below
# means that if both fire, the second queues rather than double-trading. The point is that no
# human has to notice a missed trigger: two independent systems have to fail on the same day
# for a session to be missed, and neither of them is a person.
on:
  schedule:
    - cron: "28 13 * * 1-5"   # backup for the open; cron-job.org fires the same minute
    - cron: "0 19 * * 1-5"    # backup for the closing hour
  workflow_dispatch:
    inputs:
      mode:
        description: "once = a single cycle (safe smoke test) | session = run the loop"
        type: choice
        options: [once, session]
        default: once
      max_minutes:
        description: "session mode only: minutes before the job ends itself"
        default: "60"
      live:
        description: "place real paper orders? scheduled runs always do; this is for manual runs"
        type: boolean
        default: false

# Two overlapping sessions would double-submit cycles and race each other's audit-log
# pushes. Queue instead of running concurrently; never cancel a run that is mid-cycle.
concurrency:
  group: trading-session
  cancel-in-progress: false

permissions:
  contents: write  # needed so the run can commit+push logs/audit_log.jsonl and config/live_settings.json reads

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    # Must exceed the largest --max-minutes budget (330) plus setup, or the runner kills the
    # session mid-day and the job shows red. 350 still sits under GitHub's 6h hard ceiling.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The execution path shells out to Alpaca's own CLI (see src/alpaca_cli.py), which is
      # not a pip package and is absent from the runner image. Without these two steps a
      # --live run reaches the risk gate, gets an approval, and then dies at submission with
      # "'alpaca' CLI not found on PATH" — the agent would look healthy and trade nothing.
      - name: Install the Alpaca CLI
        # Pinned, not @latest. Two reasons, both learned the hard way.
        #
        # The agent depends on exact CLI flags - it already shipped two bugs from calling
        # flags that did not exist (`order list --output json`, and `order cancel` with a
        # positional id). @latest means Alpaca can ship a release mid-competition that renames
        # or removes a flag, and the agent breaks at the execution step with nobody watching.
        #
        # Retried because this step is a network dependency on Go's module proxy and checksum
        # database, and on 2026-09-01 it failed a whole session with
        # "verifying module: ... reading https://sum.golang.org/... stream error". Nothing to
        # do with our code; the session simply never started. Now that cron-job.org triggers
        # the day unattended, one transient proxy blip at 13:28 would silently cost a full
        # trading day.
        run: |
          for attempt in 1 2 3; do
            if go install github.com/alpacahq/cli/cmd/alpaca@v0.0.14; then
              echo "alpaca CLI installed on attempt $attempt"
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::alpaca CLI install failed after 3 attempts"
              exit 1
            fi
            echo "install attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Configure the Alpaca CLI paper profile
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          alpaca profile login --api-key --paper --name paper --key "$ALPACA_API_KEY" --secret "$ALPACA_SECRET_KEY"

      # Printed into the run log on purpose: it is public, judge-readable evidence that the
      # resolved trading endpoint is paper-api before any order is built. The step fails the
      # job if any check fails, so a broken run never reaches the trading step.
      - name: Verify the CLI resolves to the paper endpoint
        run: alpaca doctor

      - name: Configure git identity for the audit-log push
        run: |
          git config user.name "trading-cycle-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Run the trading loop
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FEATHER_API_KEY: ${{ secrets.FEATHER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        # Scheduled runs place real orders on the paper account. Everything upstream of
        # submission was already real without --live -- live signals, live model calls, a
        # real risk-gate verdict -- and all of it was being computed and thrown away: one
        # order had reached the broker in five days while the gate approved ~10 contracts a
        # cycle. P&L is the first judging criterion and it cannot be earned in dry_run.
        #
        # Manual dispatch stays dry unless live is ticked, so a smoke test cannot trade.
        # The safety properties below --live are unchanged and all deterministic: defined-risk
        # spreads only, <=2% equity per trade, the 5% daily drawdown halt, and the
        # out-of-process `alpaca doctor` paper-endpoint check that runs before any order is
        # built. See src/alpaca_cli.py.
        run: |
          # A scheduled run has no inputs, so it must supply its own. It is always a live
          # session — a backup trigger that fires and then trades nothing is not a backup.
          # The budget is sized from which cron fired: the 13:28 one covers the day, the
          # 19:00 one covers the closing hour and self-exits at the bell.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "28 13 * * 1-5") BUDGET=330 ;;
              *)               BUDGET=65  ;;
            esac
            echo "scheduled trigger (${{ github.event.schedule }}) -> live session, $BUDGET min"
            python -m src.scheduler --session --max-minutes "$BUDGET" --live
            exit $?
          fi

          LIVE=""
          if [ "${{ inputs.live }}" = "true" ]; then LIVE="--live"; fi
          if [ "${{ inputs.mode }}" = "session" ]; then
            python -m src.scheduler --session --max-minutes "${{ inputs.max_minutes }}" $LIVE
          else
            python -m src.scheduler --once $LIVE
          fi
