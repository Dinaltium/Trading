# Hard-coded risk limits — read by risk_gate.py, never overridden by the LLM.
# See AGENTS.md §6 "Risk gates" for rationale.

max_loss_per_trade_pct: 0.02       # ≤2% of account equity per trade
max_total_open_risk_pct: 0.10      # ≤10% of account equity across all open positions
daily_drawdown_halt_pct: 0.05      # stop trading for the day past this loss
max_underlyings_concurrent: 3      # diversify across 2-3 names, not all-in. Deliberately
                                   # NOT raised alongside the wider universe below: more
                                   # candidates to choose from is a different thing from more
                                   # concurrent risk, and only the first is wanted here.

allowed_strategies:
  - bull_call_spread
  - bear_put_spread
  - iron_condor

kelly_fraction: 0.25                # Quarter-Kelly — conservative sizing multiplier
kelly_cap_pct: 0.02                 # Kelly-sized risk still capped at max_loss_per_trade_pct

underlyings:
  - SPY
  - QQQ
  - IWM
  - AAPL

market_regime_gate:
  # ENFORCED in risk_gate.evaluate(). Until 2026-08-30 this block was dead config: nothing
  # read it, and the only regime halt in the system was a sentence in the LLM prompt asking
  # the model nicely. That made it the one risk rule with no deterministic backing.
  #
  # Scope is deliberately narrow. The RegimeFolio-style finding is about SELLING premium in
  # a high-volatility tercile, so the halt applies to iron_condor (net credit, short vol)
  # and not to the debit spreads, which are long premium and unaffected by that concern.
  # The previous blanket reading vetoed every strategy and produced 47 refusals out of 47
  # high-IV cycles - including 19 textbook condor setups.
  premium_selling_halt_iv_rank: 90.0   # no NEW iron_condor at or above this IV rank
  enforce_rulebook: true               # reject any strategy the deterministic rulebook does not mandate

execution:
  target_dte_days: 7          # preferred days-to-expiry when picking a chain
  # Multi-leg spreads priced exactly at the mid frequently do not fill. A rival's public
  # trade journal shows 4 of 6 live orders returning not_filled at mid across a single
  # session, which is the same trade as never having proposed them. This cushion crosses
  # the spread slightly: pay a little above mid on a debit, accept a little below mid on a
  # credit. 0.02 is per-spread net price in dollars, so $2 per contract at the 100x
  # multiplier - small against a defined-risk spread's max loss, and the difference between
  # a fill and a miss. Applied to the limit price only; max profit, max loss and Kelly
  # sizing are all computed from the true mid, so the cushion can never widen the position.
  limit_price_cushion: 0.02
  # Expiries the agent must never open into. Sep 4 2026 is the hackathon's own deadline day:
  # the official P&L snapshot is taken at EOD Thursday Sep 3, and lablab confirmed that
  # positions expiring Friday Sep 4 are EXCLUDED from that measurement. A spread expiring
  # then would carry real risk and contribute nothing to the score.
  excluded_expiries:
    - 2026-09-04

adaptive_restriction:
  # Adapt only toward restriction, never toward more risk. A run of losses on one underlying
  # is the agent's own evidence that it is reading that name badly; widening exposure on a
  # winning streak would be the same reasoning run backwards, and a five-day sample cannot
  # support it. Keyed per underlying on purpose: three losses on one name is evidence about
  # the name, three losses across four names is evidence about the market and halting
  # everything on it would be the worst possible response.
  #
  # Blocks NEW entries only. Exits are never restricted - a rule that stops the agent opening
  # a position must not stop it closing one.
  max_consecutive_losses: 3

exits:
  # Deterministic stop-loss on open spreads, evaluated from broker-reported P&L and the
  # strikes parsed off the OCC symbols. No model is consulted: an LLM has no role in
  # deciding when to cut a loss, for the same reason it has none in sizing one.
  #
  # 0.60 means close once 60% of the worst case has already happened. Chosen above the
  # halfway mark because a defined-risk spread that has given up more than half its width
  # usually needs a large move back to recover, and below 1.0 so the position is closed
  # while it still has salvage value rather than expiring worthless.
  stop_loss_pct_of_max_loss: 0.60
